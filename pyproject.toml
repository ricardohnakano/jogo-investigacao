[project]
name = "jogo-investigacao"
version = "0.1.0"
description = "Jogo investigativo multi-player em servidor local"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "qrcode[pil]>=8.0",
    "pillow>=11.0",
    "pydantic-settings>=2.6",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jogo*"]

[tool.ruff]
line-length = 100
target-version = "py311"
